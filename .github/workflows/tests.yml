name: Tests and package smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[test]' build
      - run: python -m pytest
      - run: python -m build
      - name: Install wheel in a fresh environment
        shell: bash
        run: |
          python -m venv /tmp/v099-wheel-test
          /tmp/v099-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/v099-wheel-test/bin/v099-ledger demo --output /tmp/v099-example
          /tmp/v099-wheel-test/bin/v099-ledger verify /tmp/v099-example

