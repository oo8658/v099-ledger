[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "v099-ledger"
version = "0.2.0"
description = "Policy-free linear perpetual fill accounting with an independent verifier"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
v099-ledger = "v099_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
